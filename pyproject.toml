[project]
name = "lectern"
version = "0.0.0"
description = "Headless backend that turns a declared identity and its documents into a grounded conversational API"
authors = [{ name = "Eduardo Kairalla" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.1",
    "httpx>=0.28.1",
    "langchain>=1.3.15",
    "langchain-openai>=1.4.3",
    "langchain-core>=1.5.4",
    "qdrant-client>=1.19.0",
    "langchain-qdrant>=1.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "psycopg[c,pool]>=3.3.4",
    "alembic>=1.19.1",
    "openai>=2.54.0",
    "filetype>=1.2.0",
    "colorlog>=6.12.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "celery>=5.6.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.2",
    "httpx2>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
