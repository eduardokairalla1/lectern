# --- FILE LOCATIONS ---
# NOTE: this file is mounted outside PGDATA, and hba_file/ident_file default to
#       the directory holding the config file — which contains neither. Without
#       these three lines Postgres refuses to start.
data_directory = '/var/lib/postgresql/data'
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'

# --- CONNECTIONS ---
# the built-in default is localhost, which is unreachable from another container
listen_addresses = '*'
port = 5432
max_connections = 100

# --- MEMORY ---
# sized for a small VPS (~2 GB). Raise shared_buffers to ~25% of RAM and
# effective_cache_size to ~75% if the host is bigger.
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 128MB

# --- WRITE-AHEAD LOG ---
wal_level = replica
max_wal_size = 1GB
min_wal_size = 128MB
checkpoint_completion_target = 0.9

# --- QUERY PLANNER ---
# defaults assume spinning disks; these are the SSD values
random_page_cost = 1.1
effective_io_concurrency = 200

# --- LOGGING ---
# analytics writes are fire-and-forget from the worker, so a slow statement
# shows up as lag rather than as a failed request: log it here or not at all
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# --- LOCALE ---
timezone = 'UTC'
datestyle = 'iso, mdy'
