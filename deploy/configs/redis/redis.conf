# --- NETWORK ---
# reachable from the other containers on the internal network; the only route
# in from outside is the loopback-bound port published by Compose
bind 0.0.0.0
protected-mode no
port 6379
tcp-keepalive 300
timeout 0

# --- SECURITY ---
# Uncomment to require a password, and match it in the compose REDIS_URL:
#   REDIS_URL: redis://:<password>@redis:6379/0
# Worth doing if you ever publish this port on anything but 127.0.0.1.
# requirepass change-me

# --- MEMORY ---
# NOTE: noeviction is deliberate, not a leftover default. This Redis is three
#       things at once — the response cache, the conversation memory and the
#       Celery broker. An LRU policy cannot tell them apart, so under pressure
#       it would silently drop queued persistence tasks and lose analytics that
#       nothing retries. Cache and memory keys carry their own TTLs and expire
#       without help; if maxmemory is reached, writes failing loudly is the
#       outcome you want.
maxmemory 512mb
maxmemory-policy noeviction

# --- PERSISTENCE ---
# AOF, because the broker holds tasks that have already been accepted: an RDB
# snapshot alone loses whatever arrived since the last save.
dir /data
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# --- LOGGING ---
loglevel notice
